# PPO Training Configuration
# ==========================
# Mode Collapse Failsafe
stop_on_mode_collapse=true
min_training_entropy=0.5


# Target ROM
rom_path=roms/NROM/dk.nes

# PPO Hyperparameters
steps_per_update=128
gamma=0.99
gae_lambda=0.95
num_envs=16

# Environment Settings
# Actions with more than N buttons pressed are masked out
max_simultaneous_buttons=2

# Action Space Restrictions
action_allow_diagonals=false
action_allow_select_combos=false
action_allow_start_combos=false
action_allow_select_start=false
action_allow_opposite_dir=false
action_allow_start=true
action_allow_select=false

# Frame Skip: Number of frames to hold an action. (1 = Every Frame, 4 = Standard RL)
decision_interval=4

# Snapshot / Save Interval in MINUTES
# Saves a check point every X minutes regardless of speed.
snapshot_interval_minutes=30

# Visualization & Logging
# Enable live view of Environment 0 during training (Impacts performance)
render_training=false
# Record replay of Environment 0 to 'replays/' directory
record_replay=false

# PPO Specific Configuration
ppo_entropy_coef=0.01
ppo_clip_param=0.2
ppo_value_coef=0.5
ppo_learning_rate=0.0001
ppo_batch_size=64
ppo_epochs=4

# Smart Forking (GhostScout)
# Set forks > 0 to enable lookahead
smart_scout_forks=0

# Shock Collar (Cycle Repetition Punishment)
# Penalty for revisiting a state hash within the window.
# -0.5 was too harsh (caused Mode Collapse). -0.01 is a gentle nudge.
cycle_punishment_penalty=-0.25
cycle_punishment_window=600
