name: Release

# Tagging v1.2.3 builds, tests and publishes a release with the runnable jar
# attached. workflow_dispatch runs everything except the publish step, so the
# pipeline can be exercised without burning a tag.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.0). Dry run - nothing is published."
        required: true
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Resolve version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ inputs.version }}"
        else
          VERSION="${GITHUB_REF_NAME#v}"   # v1.2.3 -> 1.2.3
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Building version $VERSION"

    - name: Stamp the version into the poms
      run: >
        mvn -B -q versions:set
        -DnewVersion=${{ steps.version.outputs.version }}
        -DprocessAllModules=true
        -DgenerateBackupPoms=false

    - name: Build and test
      run: mvn -B clean verify

    # The emulator has no runtime dependencies and the jar plugin already writes
    # Main-Class, so the module jar is directly runnable - no shading required.
    - name: Stage artifacts
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir -p dist
        cp "nes-emulator/target/mochanes-emulator-$VERSION.jar" "dist/mochanes-$VERSION.jar"
        ( cd dist && sha256sum "mochanes-$VERSION.jar" > "mochanes-$VERSION.jar.sha256" )
        ls -la dist

    - name: Check the jar entry point resolves
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # A runner has no display, so the GUI cannot open. Loading Main and its
        # dependencies still proves the jar is well-formed and that Main-Class
        # resolves; reaching the ROM load or a HeadlessException is success.
        java -jar "dist/mochanes-$VERSION.jar" resources/nestest.nes > out.txt 2>&1 || true
        cat out.txt
        grep -q -e HeadlessException -e "Loading ROM" out.txt
        echo "Entry point OK."

    - name: Write release notes
      env:
        VERSION: ${{ steps.version.outputs.version }}
        REPO: ${{ github.repository }}
      run: |
        cat > notes.md <<NOTES
        ## Running

        Requires **Java 17 or newer**. There are no other dependencies.

        \`\`\`bash
        java -jar mochanes-$VERSION.jar path/to/game.nes
        \`\`\`

        ROMs are not included. Mappers 0, 1, 2, 3, 4 and 7 are supported.

        Verify the download:

        \`\`\`bash
        sha256sum -c mochanes-$VERSION.jar.sha256
        \`\`\`

        ## Documentation

        - [Tools Guide](https://github.com/$REPO/blob/main/docs/Tools_Guide.md) - controls, video options, CRT simulation
        - [Accuracy Report](https://github.com/$REPO/blob/main/docs/Accuracy.md) - test results and known gaps
        - [Architecture](https://github.com/$REPO/blob/main/docs/Architecture.md) - how it works
        NOTES
        cat notes.md

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: mochanes-${{ steps.version.outputs.version }}
        path: dist/*

    - name: Publish release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* \
          --title "MochaNES $VERSION" \
          --notes-file notes.md \
          --generate-notes \
          --verify-tag
